name: Update ETF market data

on:
  workflow_dispatch:
  schedule:
    # 미국 정규장과 시간외 거래 시간대를 대략 한 시간 간격으로 갱신합니다.
    - cron: '0 13-23 * * 1-5'
    - cron: '0 0-2 * * 2-6'

permissions:
  contents: write

concurrency:
  group: update-etf-market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch latest ETF prices
        run: node scripts/update-market-data.mjs
      - name: Commit changed prices
        run: |
          if git diff --quiet -- market-data.json; then
            echo "Market data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data.json
          git commit -m "Update ETF market data"
          git push
