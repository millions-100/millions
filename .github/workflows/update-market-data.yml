name: Update ISA income ETF market data

on:
  workflow_dispatch:
  schedule:
    # 한국 거래일의 장 전후를 포함해 한 시간 간격으로 갱신합니다. (UTC 기준)
    - cron: '0 0-8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-etf-market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch latest income ETF prices
        run: node scripts/update-market-data.mjs
      - name: Commit changed prices
        run: |
          if git diff --quiet -- market-data.json; then
            echo "Market data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data.json
          git commit -m "Update ETF market data"
          git push
